<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escavação Dino!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main id="game-screen">
        <aside id="info-panel">
            <div class="panel-card">
                <span class="label">LEVEL</span>
                <span id="level-display" class="value">1</span>
            </div>
            <div class="panel-card">
                <span class="label">LIVES</span>
                <span id="lives-display" class="value">🤎🤎🤎🤎🤎</span>
            </div>
            <div class="panel-card">
                <span class="label">TIME</span>
                <span id="timer-display" class="value">01:00</span>
            </div>
            <div class="panel-card">
                <span class="label">BONES</span>
                <span id="score-display" class="value">0 / 2</span>
            </div>
            <div class="panel-card">
                <span class="label">BRUSHES</span>
                <span id="brush-display" class="value">6</span>
            </div>
            <div class="panel-card">
                <span class="label">SOUND</span>
                <button id="sound-toggle-btn" class="value sound-toggle-btn" aria-label="Ligar ou desligar o som">🔊</button>
            </div>
        </aside>

        <section id="sandbox-frame">
            <div id="grid"></div>

            <div id="tutorial-modal" class="modal hidden">
                <div class="modal-content">
                    <h2>HOW TO PLAY</h2>
                    <p>Find all dinosaur bones before time runs out!</p>
                    <button id="tutorial-start-btn">GOT IT!</button>
                </div>
            </div>

            <div id="start-modal" class="modal hidden">
                <div class="modal-content">
                    <h2 id="start-title">Find this dino!</h2>
                    <img id="dino-preview-img" src="assets/images/t_rex.svg" alt="Dino Skeleton" style="max-width: 200px;" />
                    <button id="start-ready-btn" style="margin-top: 15px;">I'M READY</button>
                </div>
            </div>

            <div id="success-modal" class="modal hidden">
                <div class="modal-content">
                    <h2>SUCCESS!</h2>
                    <button id="next-level-btn">NEXT LEVEL</button>
                </div>
            </div>

            <div id="retry-modal" class="modal hidden">
                <div class="modal-content">
                    <h2>OOPS! TRY AGAIN!</h2>
                    <button id="retry-btn">RETRY</button>
                </div>
            </div>

            <div id="game-over-modal" class="modal hidden">
                <div class="modal-content">
                    <h2>GAME OVER</h2>
                    <button id="restart-game-btn">RESTART GAME</button>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
